# rocket_sim_trainer_seed: 1
behaviors:
  Rocket:
    trainer_type: ppo
    hyperparameters:
      batch_size: 4096
      buffer_size: 40960
      learning_rate: 0.0002
      learning_rate_schedule: linear
      beta: 0.01
      epsilon: 0.2
      lambd: 0.98
      num_epoch: 6
    network_settings:
      normalize: true
      hidden_units: 512
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.9995
        strength: 1
    max_steps: 100000000
    time_horizon: 1024
    summary_freq: 20000
    checkpoint_interval: 500000
    keep_checkpoints: 200
    threaded: true