behaviors:
  Rocket:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 20480        # Slightly smaller buffer for faster updates
      learning_rate: 3.0e-4
      beta: 1.0e-2              # Increased entropy (beta) to encourage more exploration
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    network_settings:
      normalize: true           # Keep this TRUE (essential for gimbal/velocity)
      hidden_units: 256
      num_layers: 3             # Deeper network for complex physics
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.995            # Higher gamma helps agent care about the final landing 
        strength: 1.0
    max_steps: 10000000         # Set to 10M for diploma-grade precision
    time_horizon: 128           # Shorter horizon for more frequent "thought" updates
    summary_freq: 10000
    threaded: true              # Use your CPU's multi-threading