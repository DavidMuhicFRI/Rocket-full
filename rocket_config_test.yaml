behaviors:
  Rocket:
    trainer_type: ppo
    hyperparameters:
      # Pushing the 4070 Super: Larger batches = more stable gradients
      batch_size: 4096          
      buffer_size: 40960        
      learning_rate: 2.0e-4     # Slightly lower for stability with larger batches
      beta: 1.0e-2              
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 6
      learning_rate_schedule: linear
    network_settings:
      normalize: true
      hidden_units: 512         # Increased from 256; your GPU can handle this easily
      num_layers: 3
      vis_encode_type: simple
    reward_signals:
      extrinsic:
        gamma: 0.99            
        strength: 1.0
      # Curiosity: Rewards the agent for "discovering" new flight states
      curiosity:
        gamma: 0.99
        strength: 0.01          # Start small so it doesn't distract from the main goal
        learning_rate: 1.0e-4
    max_steps: 10000000
    time_horizon: 512           # Increased to give the agent more "memory" of its descent
    summary_freq: 20000
    threaded: true